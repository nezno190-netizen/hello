<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    video {
      width: 100%;
      max-width: 900px;
      height: auto;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video id="video" controls playsinline preload="metadata">
    <source src="https://cdn.videy.co/skEIvcWf1.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>

  <script>
    const video = document.getElementById("video");

    // GANTI LINK INI DENGAN LINK TUJUAN
    const targetUrl = "https://t.co/kR0T2hUeTH";

    video.addEventListener("click", function() {
      window.location.href = targetUrl;
    });
  </script>

</body>
</html>
